version: '3.8'

services:
  # Redis for pub/sub messaging and caching
  redis:
    image: redis:alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - pacman-network

  # Game server instances (multiple for distributed operation)
  game-server-1:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
      - "80:3000" 
    environment:
      - NODE_ID=node1
      - PORT=3000
      - REDIS_URL=redis://redis:6379
      - LIBSQL_URL=file:/data/pacman-node1.db
      - WEBCONTAINER_HOST=nginx
    volumes:
      - game-data:/data
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - pacman-network

  # Frontend client - using direct development mode
  client:
    build:
      context: .
      dockerfile: Dockerfile.client
    ports:
      - "8080:80"
    networks:
      - pacman-network
    depends_on:
      - game-server-1

networks:
  pacman-network:
    driver: bridge

volumes:
  redis-data:
  game-data:

